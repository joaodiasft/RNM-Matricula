"$schema" = "./node_modules/wrangler/config-schema.json"
name = "rnm-matricula"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

# Variáveis públicas / não sensíveis (secrets ficam no Wrangler Secrets).
# O SECRET do e-mail (BREVO_API_KEY) NÃO fica aqui — use:
#   npx wrangler secret put BREVO_API_KEY
[vars]
# Destino dos avisos internos (Brevo não é sandbox — pode ser a secretaria).
COMPANY_EMAIL = "naredacaonota1000@gmail.com"
# E-mail (Brevo, remetente único verificado — sem domínio).
BREVO_SENDER = "naredacaonota1000@gmail.com"
BREVO_SENDER_NAME = "Redação Nota Mil"
RESEND_REPLY_TO = "naredacaonota1000@gmail.com"
# Fallback Resend (só entrega ao dono da conta enquanto não houver domínio).
RESEND_FROM = "Redação Nota Mil <onboarding@resend.dev>"
DEFAULT_CARD_FEE_PERCENT = "3.5"
ADMIN_EMAIL = "naredacaonota1000@gmail.com"
NEXT_PUBLIC_APP_URL = "https://rnm-matricula.jmdias2901.workers.dev"
